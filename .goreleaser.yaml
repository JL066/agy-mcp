version: 2
project_name: agy-mcp
builds:
  - main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
changelog:
  use: github
  filters:
    exclude:
      - '^ci:'
      - '^docs?:'
      - '^README'
brews:
  - repository:
      owner: tphakala
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/tphakala/agy-mcp"
    description: "Model Context Protocol (MCP) server for Google Antigravity CLI (agy)"
    license: "MIT"
    test: |
      system "#{bin}/agy-mcp", "-h"

